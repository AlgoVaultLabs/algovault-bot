[project]
name = "algovault-bot"
version = "0.1.0"
description = "Public Telegram bot for AlgoVault — regime alerts + trade calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AlgoVault Labs" }]
dependencies = [
  "python-telegram-bot==22.7",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  # BOT-ALERT-IMAGE-W1 (2026-05-08) — Pillow renders trade-call alerts as
  # metric-card PNGs (via send_photo) instead of plain text. DejaVu fonts
  # already present on Hetzner; no system-package install needed.
  "Pillow==12.2.0",
]

[project.scripts]
algovault-bot = "algovault_bot.bot:main"
algovault-bot-cron = "algovault_bot.alert_engine:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.4",
  "mypy==1.18.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
